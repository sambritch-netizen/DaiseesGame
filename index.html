<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Daisee's Game</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { background: #1a0a2e; width: 100%; height: 100%; overflow: hidden; }
        canvas { display: block; position: absolute; }
        #rotate-msg {
            display: none;
            position: fixed; inset: 0;
            background: #1a0a2e; color: #FF69B4;
            font: 24px Arial; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 40px; z-index: 9999; line-height: 2;
        }
        @media (orientation: portrait) { #rotate-msg { display: flex; } }
    </style>
</head>
<body>
    <div id="rotate-msg">🐾<br><strong style="font-size:28px">Daisee's Game</strong><br>
        Rotate your phone <strong>sideways</strong> to play! 📱↔️</div>
    <canvas id="game"></canvas>
    <script src="js/engine.js"></script>
    <script src="js/drawing.js"></script>
    <script src="js/scenes.js"></script>
</body>
</html>
